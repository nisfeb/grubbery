<!doctype html>
<html>
<head>
  <title>forge ci</title>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" type="image/svg+xml" href="/grubbery/forge/icon.svg">
  <style>
    :root { --bg: #fafaf9; --fg: #1c1b1f; --muted: #6b6870; --line: #dedbe2; --card: #fff;
            --ok: #1a7f37; --bad: #c62828; --live: #9a6700; --accent: #3d3a45; }
    @media (prefers-color-scheme: dark) {
      :root { --bg: #17161a; --fg: #ecebef; --muted: #a29fa8; --line: #34313a; --card: #1f1e23;
              --ok: #4ac26b; --bad: #ff6b6b; --live: #e3b341; --accent: #c9c5d1; }
    }
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--bg); color: var(--fg);
           font: 14px/1.45 system-ui, -apple-system, Segoe UI, sans-serif; }
    header { display: flex; gap: 12px; align-items: baseline; padding: 12px 16px;
             border-bottom: 1px solid var(--line); }
    header a { color: var(--muted); text-decoration: none; }
    h1 { font-size: 16px; margin: 0; }
    main { max-width: 1100px; margin: 0 auto; padding: 16px; display: grid; gap: 20px; }
    section { background: var(--card); border: 1px solid var(--line); border-radius: 8px; padding: 12px 14px; }
    h2 { font-size: 14px; margin: 0 0 8px; display: flex; gap: 8px; align-items: center; }
    h2 .count { color: var(--muted); font-weight: normal; }
    table { width: 100%; border-collapse: collapse; }
    th, td { text-align: left; padding: 5px 6px; border-top: 1px solid var(--line); vertical-align: top; }
    th { color: var(--muted); font-weight: 500; font-size: 12px; border-top: 0; }
    .wrap { overflow-x: auto; }
    code, .mono { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 12.5px; }
    .muted { color: var(--muted); }
    .empty { color: var(--muted); padding: 6px 0; }
    form { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 10px; }
    input { padding: 5px 8px; border: 1px solid var(--line); border-radius: 6px;
            background: var(--bg); color: var(--fg); font: inherit; min-width: 0; }
    button { padding: 4px 10px; border: 1px solid var(--line); border-radius: 6px;
             background: var(--bg); color: var(--fg); font: inherit; cursor: pointer; }
    button.primary { background: var(--accent); color: var(--bg); border-color: var(--accent); }
    .badge { display: inline-block; padding: 0 7px; border-radius: 10px; font-size: 12px;
             border: 1px solid var(--line); margin: 0 4px 2px 0; cursor: pointer; }
    .succeeded { color: var(--ok); border-color: var(--ok); }
    .failed { color: var(--bad); border-color: var(--bad); }
    .running, .queued, .waiting { color: var(--live); border-color: var(--live); }
    .cancelled { color: var(--muted); }
    .online { color: var(--ok); } .offline { color: var(--muted); }
    .key { margin-top: 10px; padding: 10px; border: 1px solid var(--live); border-radius: 6px; }
    .key pre { margin: 6px 0 0; white-space: pre-wrap; word-break: break-all; }
    #log { margin-top: 10px; }
    #log pre { background: var(--bg); border: 1px solid var(--line); border-radius: 6px; padding: 10px;
               max-height: 480px; overflow: auto; white-space: pre-wrap; word-break: break-word; margin: 6px 0 0; }
    .err { color: var(--bad); }
  </style>
</head>
<body>
  <header>
    <h1>forge ci</h1>
    <a href="/grubbery/forge">forge</a>
    <span id="status" class="muted"></span>
  </header>
  <main>
    <section>
      <h2>runs <span class="count" id="runs-count"></span></h2>
      <div class="wrap"><table id="runs"></table></div>
      <div id="log"></div>
    </section>
    <section>
      <h2>watched repos <span class="count" id="watched-count"></span></h2>
      <div class="wrap"><table id="watched"></table></div>
      <form id="watch-form">
        <input name="repo" placeholder="owner/repo" required size="22">
        <input name="branches" placeholder="branches, comma-separated (main)" size="28">
        <input name="minutes" type="number" min="1" value="5" style="width:70px" title="poll every N minutes">
        <button class="primary">watch</button>
      </form>
    </section>
    <section>
      <h2>runners <span class="count" id="runners-count"></span></h2>
      <div class="wrap"><table id="runners"></table></div>
      <form id="runner-form">
        <input name="name" placeholder="runner name" required size="18">
        <input name="repos" placeholder="repos it may serve, comma-separated (any)" size="34">
        <button class="primary">add runner</button>
      </form>
      <div id="new-key"></div>
    </section>
  </main>
  <script src="/grubbery/forge/ci/app.js"></script>
</body>
</html>

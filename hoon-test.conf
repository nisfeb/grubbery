# hoon-test-kit: grubbery's own suites (desk/tests) on a test desk.
# Sourced by bash and parsed by python, so plain KEY="value" lines only.
# Paths are relative to this file. See scripts/hoon-test-kit/README.md
# and TESTING.md.

# the test desk: never %grubbery itself
DESK=grubbery-test

# the libs under test and every lib they import (desk/lib)
LIBS="desk/lib/aes-gcm.hoon desk/lib/build.hoon desk/lib/hkdf.hoon desk/lib/jwt.hoon desk/lib/loader.hoon desk/lib/marks.hoon desk/lib/multipart.hoon desk/lib/nexus.hoon desk/lib/tarball.hoon desk/lib/web-push.hoon"

# ./lib/NAME is looked up under CODE too (offline-test.py)
CODE=desk

# every *.hoon here lands in tests/lib/ (desk/tests/lib/quiz.hoon is
# not taken: it imports lattice-quiz, which this desk does not ship)
TESTS=desk/tests

# fixtures: web-push's /-  push
FILES="desk/sur/push.hoon=sur/push.hoon"

MARKS="json mime"
